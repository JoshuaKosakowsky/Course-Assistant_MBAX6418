name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit and smoke tests
        run: pytest -m "unit or smoke" -q

      - name: Secret scan (class security policy)
        run: |
          BAD=0
          for f in $(git ls-files | grep -v '^\.env\.example$'); do
            if grep -qE '(sk-[A-Za-z0-9_-]{16,}|gh[pous]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' "$f" 2>/dev/null; then
              echo "::error::Possible secret pattern in $f"
              BAD=1
            fi
          done
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git"
            BAD=1
          fi
          exit $BAD
