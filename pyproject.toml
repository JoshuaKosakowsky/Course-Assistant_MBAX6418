[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'unit or smoke'"
markers = [
    "unit: fast, offline tests of pure logic (default run)",
    "smoke: minimal cross-component wiring tests on fixtures (default run)",
    "e2e: tests against real class endpoints; requires .env keys (opt-in)",
]
